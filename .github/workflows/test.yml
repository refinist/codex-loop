name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24.0.0", "24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install Codex for Windows launcher smoke test
        if: runner.os == 'Windows'
        run: npm install --global @openai/codex
      - name: Verify Windows npm Codex launcher
        if: runner.os == 'Windows'
        run: node --input-type=module -e "import {executablePrefix} from './scripts/loop_platform.mjs'; import {spawnSync} from 'node:child_process'; const [exe,...args]=executablePrefix('codex'); const r=spawnSync(exe,[...args,'--version'],{stdio:'inherit'}); if(r.error) throw r.error; process.exit(r.status ?? 1);"
