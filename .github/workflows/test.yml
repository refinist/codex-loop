name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tzdata
        if: runner.os == 'Windows'
      - run: python -m unittest discover -s tests -v
      - name: Install Codex for Windows launcher smoke test
        if: runner.os == 'Windows'
        run: npm install --global @openai/codex
      - name: Verify Windows npm Codex launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import subprocess, sys
          sys.path.insert(0, "scripts")
          from loop_platform import executable_prefix
          subprocess.run(executable_prefix("codex") + ["--version"], check=True)
          '@ | python -
